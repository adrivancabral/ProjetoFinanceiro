<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar | Lenny Grana</title>
    <link rel="stylesheet" href="css/cadastro.css">
    <script src="js/cadastro.js" defer></script>
</head>
<body>
    <main class="cadastro-container">
        <section class="cadastro-card">
            <header class="cadastro-header">
                <a href="index.html" class="logo">Lenny<span>Grana</span></a>
                <h1>Crie sua conta!</h1>
                <p>Comece a organizar sua vida financeira de maneira simples.</p>
            </header>
            <form id="form-cadastro">
                <div class="form-grupo">
                        <label for="nome">Nome completo</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" required>
                </div>
                <div class="form-grupo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" placeholder="Digite seu E-mail" autocomplete="email" required>
                </div>
                <div class="form-grupo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha" autocomplete="new-password" required>
                </div>
                <div class="form-grupo">
                    <label for="confirmar-senha">Confirmar senha</label>
                    <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite novamente sua senha" required>
                </div>
                <button type="submit" class="botao-cadastro">Cadastrar</button>
            </form>
            <div class="cadastro-rodape">
                <p>Já tem uma conta? <a href="login.html">Faça login</a></p>
            </div>
        </section>
    </main>
</body>
</html>
